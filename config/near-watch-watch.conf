# near-watch's watch list and the relayer's gas per payment, read by nearadminup.ps1 (chainiam-private-ai
# architecture-tab03-agent-mode.md ARCH-313). Not secret: account ids and a NEAR amount only.
#   WATCH=label=role=account     one line per watched account; role payto|buyer|relayer|other
#   GAS_PER_PAYMENT_NEAR=D       NEAR one x402 payment costs the relayer (needed with a relayer watch)
# These are today's values (the same as docker-compose.yml's own command). For tab 03 agent mode, add one buyer line
# per tenant (t01 is buyer1 below) and your manual wallet account, e.g.
#   WATCH=t02=buyer=chainaim-t02-seller.testnet
#   WATCH=t03=buyer=chainaim-t03-seller.testnet
# nearadminup.ps1 -Watch ... -GasPerPaymentNear ... override this file for one start.
WATCH=buyer1=buyer=chainaim-buyer-seller.testnet
WATCH=relayer=relayer=chainaim-relayer-seller.testnet
GAS_PER_PAYMENT_NEAR=0.000333
WATCH=t02=buyer=chainaim-t02-seller.testnet
WATCH=t03=buyer=chainaim-t03-seller.testnet
WATCH=intear=buyer=nishanthini.testnet
